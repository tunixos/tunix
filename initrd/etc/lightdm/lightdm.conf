# LightDM on Tunix.
#
# The daemon owns the X server; the greeter and the session are its children.
#
# minimum-vt is the setting that matters here. LightDM always claims a terminal
# for the seat -- it asks for the first free one at or above this number and
# then VT_ACTIVATEs it -- and upstream's default of 7 names a terminal that does
# not exist. Tunix has one console, which the kernel answers for as VT 1, so
# that is the one to ask for. The X server is still started through a wrapper
# that sets XORG_NO_VT, because Xorg binding a console is a separate question
# from LightDM tracking one.

[LightDM]
minimum-display-number=0
minimum-vt=1
# Passwords go through the plain heap rather than libgcrypt's secure pool.
# Tunix has no mlock and no swap, so a "locked" pool would be locking nothing;
# and LightDM does not check what its allocator returns, so a pool that fails
# to come up is a write to a null pointer rather than an error.
lock-memory=false
greeter-user=lightdm
run-directory=/run/lightdm
greeters-directory=/usr/share/xgreeters
sessions-directory=/usr/share/xsessions
log-directory=/var/log/lightdm
cache-directory=/var/cache/lightdm

[Seat:*]
xserver-command=/etc/lightdm/Xserver
session-wrapper=/etc/lightdm/Xsession
# The greeter needs the same environment: it is a GTK program and LightDM does
# not put its children through a shell, so nothing else would set XDG_*.
greeter-wrapper=/etc/lightdm/Xsession
greeter-session=lightdm-gtk-greeter
user-session=tunix
greeter-hide-users=false
# The guest session needs AppArmor and a writable throwaway home; neither is
# here, and its helper is not installed.
allow-guest=false

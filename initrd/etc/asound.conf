# ALSA system configuration for Tunix.
#
# The stock cards/HDA-Intel.conf makes `default` an asym of dmix and dsnoop,
# with a softvol on top. Neither can work here: dmix shares its ring between
# processes through SysV shared memory and semaphores, which Tunix has no
# syscalls for, and softvol asks the driver to create a control element, which
# the kernel does not implement. Both fail at snd_pcm_open, so `default` would
# be a device that never opens.
#
# So `default` is the plug plugin straight onto the hardware: format and rate
# conversion where the card needs it, one writer at a time. Mixing several
# streams is PipeWire's job, not the kernel's.

pcm.!default {
    type plug
    slave.pcm "hw:0,0"
}

ctl.!default {
    type hw
    card 0
}

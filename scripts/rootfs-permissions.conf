# Permission overrides for the initramfs, applied by scripts/apply-permissions.py.
#
# Only exceptions belong here. Directories default to 0755, programs (ELF or a
# #! line) to 0755 and everything else to 0644, all owned by root.
#
#   <path glob>  <mode | ->  [uid gid]
#
# Later rules win, and a mode of "-" changes only the ownership.

# The password database. /etc/shadow is the whole point of the split: the
# hashes must not be readable by the users they belong to.
/etc/shadow             0600
/etc/gshadow            0600
/etc/sudoers            0440
/etc/sudoers.d/         0750

# Setuid root. su and sudo have to become another identity, and passwd and
# friends have to write a file their caller cannot.
/bin/su                 4755
/usr/bin/passwd         4755
/usr/bin/chfn           4755
/usr/bin/chsh           4755
/usr/bin/gpasswd        4755
/usr/bin/newgrp         4755
/usr/bin/sudo           4755

# Shared scratch space: writable by everyone, but only the owner of a file may
# remove it.
/tmp/                   1777
/var/tmp/               1777

# Home directories.
/root/                  0700
/home/tunix/            0755 1000 1000
/home/tunix/*           -    1000 1000
/run/user/1000/         0700 1000 1000

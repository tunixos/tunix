name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image-and-boot:
    name: build-image-and-boot
    runs-on: ubuntu-latest
    # Generous, because the FIRST run (or a toolchain-version bump) builds the
    # whole port tree from scratch -- the musl/gcc cross toolchain and LLVM alone
    # are most of it. Every later run restores ports/out from the cache and only
    # rebuilds the kernel + initramfs, finishing in a few minutes.
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          # Submodules are fetched shallow when this is 1, which only brings the
          # default branch tip. Any submodule pinned to a release tag rather
          # than to the tip of master then fails to resolve, and Savannah does
          # not serve unadvertised objects, so the direct-SHA fallback fails
          # too. Full history keeps every pin reachable.
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            ca-certificates \
            cmake \
            file \
            flex \
            gettext \
            git \
            gperf \
            libtool \
            make \
            nasm \
            pkg-config \
            python3 \
            python3-pil \
            qemu-system-x86 \
            tar \
            texinfo \
            xz-utils

      # git checkout gives every source file a fresh mtime, so without a cache
      # `make all` rebuilds every port on every run -- including the gcc cross
      # toolchain, whose extraction floods and truncates the log. Cache the built
      # ports/out and key it on what actually determines a port build: the build
      # scripts, the shared port library, and the submodule pins (the source
      # versions). A change to any of those busts the cache and rebuilds.
      - name: Record submodule pins (part of the ports cache key)
        run: git submodule status --recursive > .ci-submodule-pins

      - name: Cache built ports
        id: ports-cache
        uses: actions/cache@v4
        with:
          path: ports/out
          key: ports-out-v1-${{ hashFiles('ports/*.sh', 'ports/lib/*.sh', '.ci-submodule-pins') }}
          # Fall back to the newest ports cache so a single changed port rebuilds
          # incrementally instead of from zero (the gcc toolchain stays reused, as
          # build-musl-cross.sh keys reuse on an existing stamp, not on mtimes).
          restore-keys: |
            ports-out-v1-

      # On an exact hit the port inputs are byte-for-byte identical, so it is safe
      # to bump the cached outputs past the just-checked-out sources and let make
      # skip every port. (Only on an exact hit -- a partial restore must let make
      # rebuild whatever changed.)
      - name: Reuse cached ports
        if: steps.ports-cache.outputs.cache-hit == 'true'
        run: find ports/out -exec touch -c {} +

      - name: Build disk image
        run: make all

      - name: Run host runtime checks
        run: |
          make dynamic-runtime-check
          make shared-image-codecs-check

      - name: Boot smoke test
        run: make qemu-ci

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tunix-ci-${{ github.sha }}
          path: |
            build/tunix.img
            build/kernel.elf
            build/initramfs.img
            build/qemu-ci.log
          if-no-files-found: warn
          retention-days: 14
